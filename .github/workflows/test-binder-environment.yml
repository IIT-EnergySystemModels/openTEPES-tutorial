name: Test Binder Environment

on:
  pull_request:
    paths:
      - 'environment.yml'
      - 'postBuild'
      - '.gitmodules'
      - '.github/workflows/test-binder-environment.yml'
  push:
    branches:
      - main
    paths:
      - 'environment.yml'
      - 'postBuild'
      - '.gitmodules'
      - '.github/workflows/test-binder-environment.yml'

jobs:
  test-binder-build:
    runs-on: ubuntu-latest
    name: Test Binder Environment Build
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          use-mamba: true
          python-version: "3.12"
          channels: conda-forge,defaults
          channel-priority: flexible
      
      - name: Display environment info
        shell: bash -l {0}
        run: |
          conda info
          conda list
          conda config --show-sources
          conda config --show channels
      
      - name: Create environment from environment.yml
        shell: bash -l {0}
        run: |
          echo "Creating conda environment from environment.yml..."
          mamba env create -n test-binder-env -f environment.yml

      - name: Install openTEPES from submodule (mirror postBuild)
        shell: bash -l {0}
        run: |
          conda activate test-binder-env
          git submodule update --init --recursive
          pip install -e ./external/openTEPES

      - name: Verify environment
        shell: bash -l {0}
        run: |
          echo "Activating environment..."
          conda activate test-binder-env
          
          echo "Python version:"
          python --version
          
          echo "Installed packages:"
          conda list
          
          echo "Verifying binary solvers:"
          which glpsol
          which cbc
          
          echo "Environment created successfully!"
      
      - name: Test basic imports and functionality
        shell: bash -l {0}
        run: |
          conda activate test-binder-env
          python << 'EOF'
          import sys
          print('Python:', sys.version)
          print('Testing core dependencies...')
          
          failed = []
          
          # Test openTEPES
          try:
              import openTEPES
              print('✓ openTEPES imported successfully')
          except Exception as e:
              print(f'✗ openTEPES import failed: {e}')
              failed.append('openTEPES')
          
          # Test tsam
          try:
              import tsam
              print('✓ tsam imported successfully')
          except Exception as e:
              print(f'✗ tsam import failed: {e}')
              failed.append('tsam')
          
          # Test highspy
          try:
              import highspy
              print('✓ highspy imported successfully')
          except Exception as e:
              print(f'✗ highspy import failed: {e}')
              failed.append('highspy')

          # Report the openTEPES version so a downgrade is visible in the log
          try:
              import openTEPES
              print('openTEPES version:', openTEPES.__version__)
          except Exception:
              pass

          if failed:
              print(f'\n❌ {len(failed)} package(s) failed to import: {", ".join(failed)}')
              sys.exit(1)
          else:
              print('\n✅ All core dependencies are working!')
          EOF
      
      - name: Solve the 9n case (catches a silent openTEPES downgrade)
        shell: bash -l {0}
        run: |
          conda activate test-binder-env
          python << 'EOF'
          import glob
          from openTEPES.openTEPES import openTEPES_run

          # DIR is the parent folder of the case; CaseName is the bundled 9-node case.
          openTEPES_run('notebooks', '9n', 'appsi_highs', 'Yes', 'No')

          results = glob.glob('notebooks/9n/oT_Result_*9n*.csv')
          print(f'9n solved, {len(results)} result file(s) written')
          assert results, 'no result files written - the 9n solve did not complete'
          EOF

      - name: Summary
        if: success()
        shell: bash -l {0}
        run: |
          echo "✅ Binder environment build test PASSED"
          echo "The environment.yml configuration is valid and all dependencies can be installed."
          echo "This indicates that Binder should be able to build this environment successfully."
